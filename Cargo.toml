[package]
name = "tantivy-helper"
version = "0.2.0"
edition = "2024"
# MSRV exception per engineering-standards §1
rust-version = "1.86"
description = "Full-text search for Rust — Tantivy wrapper with BM25 ranking, autocomplete, highlighting, and typed queries"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/tantivy-helper"
keywords = ["tantivy", "search", "fulltext", "bm25", "highlight"]
categories = ["text-processing"]
exclude = ["/target"]

[dependencies]
tantivy = "0.26"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = "1"

[features]
default = ["bm25"]
bm25 = []

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
